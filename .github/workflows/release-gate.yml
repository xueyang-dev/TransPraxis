name: Release gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Compile and import critical modules
        run: |
          python -m py_compile app.py core.py transpraxis/academic_writer.py \
            transpraxis/compliance.py transpraxis/thesis_constraints.py
          python - <<'PY'
          import transpraxis.academic_writer
          import transpraxis.compliance
          import transpraxis.thesis_constraints

          print("critical module compile/import: OK")
          PY
      - name: Run tests
        run: python -m pytest -q

  package:
    name: build and wheel smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build frontend
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Inspect release archives
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          wheel_names = zipfile.ZipFile(wheel).namelist()
          sdist_names = [item.name for item in tarfile.open(sdist).getmembers()]
          required = (
              "app.py",
              "core.py",
              "gui.py",
              "transpraxis/resources/en_common.txt",
              "transpraxis/resources/brand/transpraxis-logo.png",
          )
          assert all(any(name.endswith(path) for name in wheel_names) for path in required)
          assert all(any(name.endswith(path) for name in sdist_names) for path in required)
          forbidden = (
              "outputs/", "eval/results/", ".env", "provider_config.json",
              "source.bin", "state.json", "translation_memory.json",
              "__pycache__/", ".pytest_cache/", ".venv/",
          )
          names = wheel_names + sdist_names
          assert not [name for name in names if any(part in name for part in forbidden)]
          print(f"checked {wheel.name} and {sdist.name}")
          PY
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/transpraxis"
          "$RUNNER_TEMP/transpraxis/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/transpraxis/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/transpraxis/bin/python" - <<'PY'
          from pathlib import Path
          import core
          import gui
          import transpraxis

          assert Path(gui.ROOT, "app.py").is_file()
          assert Path(gui.ROOT, "transpraxis", "resources", "en_common.txt").is_file()
          assert Path(gui.ROOT, "transpraxis", "resources", "brand", "transpraxis-logo.png").is_file()
          print("installed imports and resources: OK")
          PY
          "$RUNNER_TEMP/transpraxis/bin/transpraxis" --help
